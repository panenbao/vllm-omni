# Qwen3-Omni-MoE Decoupled 5-stage deploy configuration.
#
# Five independent stages, each deployable on separate GPU sets:
#   Stage 0: Audio Encoder  — audio → audio embeddings
#   Stage 1: Visual Encoder — image/video → visual embeddings
#   Stage 2: Thinker LM    — text + embeddings → hidden states (AR)
#   Stage 3: Talker        — hidden states → RVQ codec codes
#   Stage 4: Code2Wav      — RVQ codes → audio waveform
#
# Sequential routing: 0 → 1 → 2 → 3 → 4
# Encoder stages pass through when no matching input is present.
#
# GPU layout (8x H100):
#   audio_encoder(0) → visual_encoder(1) → thinker_lm(2-5, TP=4) → talker(6) → code2wav(7)

pipeline: qwen3_omni_moe_decoupled

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  # ══════════ Stage 0: Audio Encoder ══════════
  - stage_id: 0
    model_stage: audio_encoder
    model_arch: Qwen3OmniMoeDecoupledForConditionalGeneration
    max_num_batched_tokens: 8192
    max_num_seqs: 64
    gpu_memory_utilization: 0.3
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    engine_output_type: latent
    profiler_config:
      profiler: torch
      torch_profiler_dir: /home/MotivationExperiment/output/vllm_profile
      torch_profiler_use_gzip: true

  # ══════════ Stage 1: Visual Encoder ══════════
  - stage_id: 1
    model_stage: visual_encoder
    model_arch: Qwen3OmniMoeDecoupledForConditionalGeneration
    max_num_batched_tokens: 8192
    max_num_seqs: 64
    gpu_memory_utilization: 0.5
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    engine_output_type: latent
    input_connectors:
      from_stage_0: connector_of_shared_memory
    profiler_config:
      profiler: torch
      torch_profiler_dir: /home/MotivationExperiment/output/vllm_profile
      torch_profiler_use_gzip: true

  # ══════════ Stage 2: Thinker LM ═════════════
  - stage_id: 2
    model_stage: thinker_lm
    model_arch: Qwen3OmniMoeDecoupledForConditionalGeneration
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.9
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "2,3,4,5"
    tensor_parallel_size: 4
    engine_output_type: latent
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
    profiler_config:
      profiler: torch
      torch_profiler_dir: /home/MotivationExperiment/output/vllm_profile
      torch_profiler_use_gzip: true

  # ══════════ Stage 3: Talker ═════════════════
  - stage_id: 3
    model_stage: talker
    # model_arch: Qwen3OmniMoeDecoupledForConditionalGeneration
    model_arch: Qwen3OmniMoeForConditionalGeneration
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "6"
    engine_output_type: latent
    input_connectors:
      from_stage_2: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05
    profiler_config:
      profiler: torch
      torch_profiler_dir: /home/MotivationExperiment/output/vllm_profile
      torch_profiler_use_gzip: true

  # ══════════ Stage 4: Code2Wav ═══════════════
  - stage_id: 4
    model_stage: code2wav
    # model_arch: Qwen3OmniMoeDecoupledForConditionalGeneration
    model_arch: Qwen3OmniMoeForConditionalGeneration
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.2
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "7"
    engine_output_type: audio
    input_connectors:
      from_stage_3: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
    profiler_config:
      profiler: torch
      torch_profiler_dir: /home/MotivationExperiment/output/vllm_profile
      torch_profiler_use_gzip: true
      torch_profiler_record_shapes: true
      torch_profiler_with_stack: true
      torch_profiler_with_memory: true
      torch_profiler_with_flops: false
      torch_profiler_dump_cuda_time_total: false
      delay_iterations: 0
      max_iterations: 0
      wait_iterations: 0
      warmup_iterations: 0
      active_iterations: 1

platforms:
  npu:
    stages:
      - stage_id: 2
        gpu_memory_utilization: 0.6
        tensor_parallel_size: 2
        max_num_batched_tokens: 8192
        devices: "2,3"
      - stage_id: 3
        gpu_memory_utilization: 0.6
        max_num_batched_tokens: 8192
        devices: "4"
      - stage_id: 4
        gpu_memory_utilization: 0.3
        devices: "4"

  rocm:
    stages:
      - stage_id: 4
        enforce_eager: true

  xpu:
    stages:
      - stage_id: 2
        tensor_parallel_size: 4
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "2,3,4,5"
      - stage_id: 3
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "6"
      - stage_id: 4
        gpu_memory_utilization: 0.3
        max_cudagraph_capture_size: 0
        devices: "7"
